<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project tracking intro component</title>
    <!-- Page Icon -->
    <link rel="favicon" href="images/favicon-32x32.png" />
    <!-- Style File -->
    <link rel="stylesheet" href="style.css" />
    <!-- Script File -->
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header>
        <div><img src="images/logo.svg" alt="page logo" /></div>
        <nav>
          <div class="icon-hamburger">
            <img src="images/icon-hamburger.svg" />
          </div>
          <ul class="nav hidden">
            <li><a href="#">Product</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">Pricing</a></li>
            <li><a href="#">Login</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <section class="content">
          <p class="new"><span>New</span> Monograph Dashboard</p>
          <h1>Powerful insights into your team</h1>
          <p class="project">
            Project planning and time tracking for agile teams
          </p>
          <div>
            <button>SCHEDULE A DEMO</button>
            <span class="preview">to see a preview</span>
          </div>
        </section>
        <div class="img-cont">
          <img
            src="images/illustration-devices.svg"
            alt="devices illustration"
          />
        </div>
      </main>
    </div>
  </body>
</html>
